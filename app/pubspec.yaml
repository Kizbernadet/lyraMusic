name: lyra
description: "LyraMusic - lecteur de musique locale, offline first"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Lecture audio + arrière-plan + notification / écran verrouillé
  just_audio: 0.10.6
  audio_service: 0.18.19
  audio_session: 0.2.4

  # Lecture et écriture des tags (MP3 / FLAC / M4A), pur Dart
  audio_metadata_reader: 1.8.0

  # Stockage local
  sqflite: 2.4.4
  shared_preferences: 2.5.5
  path_provider: 2.1.6
  path: ^1.9.0

  # Divers
  permission_handler: 13.0.2
  image_picker: 1.2.3
  provider: 6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-Nunito.txt
    - assets/fonts/OFL-PlayfairDisplay.txt
    - assets/fonts/OFL-BebasNeue.txt
    - assets/fonts/OFL-Caveat.txt
    - assets/fonts/OFL-SpaceMono.txt

  # Polices de la charte (licence SIL OFL 1.1), embarquées pour le hors-ligne.
  # Titres : Nunito (alternative à « Poppins Rounded » de la charte) · Texte : Inter.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-500.ttf
          weight: 500
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    # Polices des LyricsCards (SIL OFL 1.1), embarquées elles aussi.
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
